name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate versions
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          for pkg in packages/cli; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::$pkg version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
              exit 1
            fi
          done
          echo "All versions match: $TAG_VERSION"

      - name: Build packages
        run: pnpm build

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      # TODO(promote): npm publish is disabled until @agrune/cli is promoted to
      # the public `agrune` package — it must be flipped to private:false and its
      # workspace:* deps bundled (tsup already noExternals them) before publish
      # will succeed. Re-enable the line below once that lands.
      - name: Publish agrune
        run: |
          echo "::warning::publish skipped — promote @agrune/cli to the public 'agrune' package first"
          # pnpm --filter @agrune/cli publish --access public --no-git-checks
