name: React Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/react/**'
      - 'packages/manifest/**'
      - '.github/workflows/react-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'packages/react/**'
      - 'packages/manifest/**'
      - '.github/workflows/react-matrix.yml'

concurrency:
  group: react-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-matrix:
    name: react matrix (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react:
          - '17.0.2'
          - '18.3.1'
          - '19.2.5'
        include:
          - react: '17.0.2'
            types-react: '17'
          - react: '18.3.1'
            types-react: '18'
          - react: '19.2.5'
            types-react: '19'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build upstream workspace packages
        run: |
          pnpm --filter @agrune/manifest run build
          pnpm --filter @agrune/react run build

      - name: Override React version to ${{ matrix.react }}
        # --no-save: package.json / lockfile 오염 방지 (T-13-20)
        # --ignore-workspace-root-check: workspace 하위 패키지에서 add 허용
        run: |
          pnpm --filter @agrune/react add -D \
            react@${{ matrix.react }} \
            react-dom@${{ matrix.react }} \
            @types/react@^${{ matrix.types-react }}.0.0 \
            @types/react-dom@^${{ matrix.types-react }}.0.0 \
            --ignore-workspace-root-check --no-save

      - name: Typecheck @agrune/react with React ${{ matrix.react }}
        run: pnpm --filter @agrune/react run typecheck

      - name: Test @agrune/react with React ${{ matrix.react }}
        run: pnpm --filter @agrune/react run test

      - name: Upload test results on failure
        # T-13-22: test-results에 민감 정보 없음. if-no-files-found: ignore로 no-op 보장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-matrix-${{ matrix.react }}-failure
          path: packages/react/test-results/
          retention-days: 7
          if-no-files-found: ignore
