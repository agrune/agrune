name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Pack smoke test
        run: |
          rm -rf /tmp/agrune-pack-smoke
          mkdir -p /tmp/agrune-pack-smoke/install
          pnpm --filter agrune pack --pack-destination /tmp/agrune-pack-smoke
          TARBALL=$(ls /tmp/agrune-pack-smoke/agrune-*.tgz | head -1)
          npm install --prefix /tmp/agrune-pack-smoke/install --omit=dev "$TARBALL"
          /tmp/agrune-pack-smoke/install/node_modules/.bin/agrune mcp --help
          /tmp/agrune-pack-smoke/install/node_modules/.bin/agrune --codex --local --dry-run
          pnpm --filter agrune-devtools pack --pack-destination /tmp/agrune-pack-smoke
          DEVTOOLS_TARBALL=$(ls /tmp/agrune-pack-smoke/agrune-devtools-*.tgz | head -1)
          npm install --prefix /tmp/agrune-pack-smoke/install --omit=dev "$DEVTOOLS_TARBALL"
          /tmp/agrune-pack-smoke/install/node_modules/.bin/agrune-devtools --help

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build upstream packages
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm test:e2e:install

      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: packages/e2e/test-results/
          retention-days: 7
