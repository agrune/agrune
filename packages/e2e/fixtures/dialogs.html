<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>dialogs fixture</title>
  </head>
  <body>
    <button id="confirm-button" onclick="handleConfirm()">Confirm</button>
    <button id="prompt-button" onclick="handlePrompt()">Prompt</button>
    <p id="status">idle</p>

    <script>
      window.__agrune_manifest__ = {
        version: 3,
        groups: [
          {
            groupId: 'dialogs',
            name: 'Dialogs',
            targets: [
              {
                targetId: 'confirm-button',
                name: 'Confirm',
                desc: 'Confirm dialog button',
                actionKinds: ['click'],
                selector: { css: '#confirm-button' }
              },
              {
                targetId: 'prompt-button',
                name: 'Prompt',
                desc: 'Prompt dialog button',
                actionKinds: ['click'],
                selector: { css: '#prompt-button' }
              }
            ]
          }
        ]
      }

      function handleConfirm() {
        document.querySelector('#status').textContent =
          confirm('Delete item?') ? 'confirm:accepted' : 'confirm:dismissed'
      }

      function handlePrompt() {
        const value = prompt('Name?', 'Anon')
        document.querySelector('#status').textContent = 'prompt:' + String(value)
      }
    </script>
  </body>
</html>
