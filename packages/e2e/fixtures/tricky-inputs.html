<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>tricky-inputs fixture</title>
  </head>
  <body>
    <label>Card number:
      <input
        inputmode="numeric"
        maxlength="19"
        id="cc"
      >
    </label>

    <label>Bio:
      <div
        contenteditable="true"
        id="bio"
        style="border:1px solid #ccc; min-height:40px; padding:4px;"
      ></div>
    </label>

    <label>Password:
      <input
        type="password"
        id="pw"
      >
    </label>

    <label>Form email:
      <input
        id="form-email"
        oninput="updateFormStatus()"
      >
    </label>

    <label>Subscribe:
      <input
        type="checkbox"
        id="form-subscribe"
        onchange="updateFormStatus()"
      >
    </label>

    <label>Email contact:
      <input
        type="radio"
        name="contact"
        value="email"
        id="form-contact-email"
        onchange="updateFormStatus()"
      >
    </label>

    <label>Phone contact:
      <input
        type="radio"
        name="contact"
        value="phone"
        id="form-contact-phone"
        onchange="updateFormStatus()"
      >
    </label>

    <label>Country:
      <select
        id="country"
        onchange="document.querySelector('#country-status').textContent = 'country:' + this.value"
      >
        <option value="">Choose</option>
        <option value="kr">Korea</option>
        <option value="us">United States</option>
      </select>
    </label>
    <p id="country-status">country:</p>

    <label>Volume:
      <input
        type="range"
        min="0"
        max="10"
        value="0"
        id="form-volume"
        oninput="updateFormStatus()"
        onchange="updateFormStatus()"
      >
    </label>
    <p id="form-status">form:</p>

    <script>
      window.__agrune_manifest__ = {
        version: 3,
        groups: [
          {
            groupId: 'form',
            name: 'Signup form',
            desc: 'Credit card + bio form',
            targets: [
              {
                targetId: 'cc-number',
                name: 'Card number',
                desc: 'Credit card number — 16 digits',
                actionKinds: ['fill'],
                selector: { css: '#cc' },
                sensitive: true
              },
              {
                targetId: 'bio',
                name: 'Bio',
                desc: 'Short bio — rich text',
                actionKinds: ['fill'],
                selector: { css: '#bio' }
              },
              {
                targetId: 'pw',
                name: 'Password',
                desc: 'Account password — sensitive',
                actionKinds: ['fill'],
                selector: { css: '#pw' },
                sensitive: true
              },
              {
                targetId: 'form-email',
                name: 'Form email',
                desc: 'Email form field',
                actionKinds: ['fill'],
                selector: { css: '#form-email' }
              },
              {
                targetId: 'form-subscribe',
                name: 'Subscribe',
                desc: 'Subscribe checkbox',
                actionKinds: ['fill'],
                selector: { css: '#form-subscribe' }
              },
              {
                targetId: 'form-contact-email',
                name: 'Contact email',
                desc: 'Email contact radio',
                actionKinds: ['fill'],
                selector: { css: '#form-contact-email' }
              },
              {
                targetId: 'country',
                name: 'Country',
                desc: 'Country dropdown',
                actionKinds: ['select'],
                selector: { css: '#country' }
              },
              {
                targetId: 'form-volume',
                name: 'Volume',
                desc: 'Volume slider',
                actionKinds: ['fill'],
                selector: { css: '#form-volume' }
              }
            ]
          }
        ]
      }

      function updateFormStatus() {
        const contact = document.querySelector('input[name="contact"]:checked')?.value || 'none'
        document.querySelector('#form-status').textContent = [
          'form:' + document.querySelector('#form-email').value,
          document.querySelector('#form-subscribe').checked ? 'yes' : 'no',
          contact,
          document.querySelector('#country').value,
          document.querySelector('#form-volume').value
        ].join('|')
      }
    </script>
  </body>
</html>
