<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>tricky-inputs fixture</title>
  </head>
  <body>
    <label>Card number:
      <input
        inputmode="numeric"
        maxlength="19"
        id="cc"
      >
    </label>

    <label>Bio:
      <div
        contenteditable="true"
        id="bio"
        style="border:1px solid #ccc; min-height:40px; padding:4px;"
      ></div>
    </label>

    <label>Password:
      <input
        type="password"
        id="pw"
      >
    </label>

    <script>
      window.__agrune_manifest__ = {
        version: 3,
        groups: [
          {
            groupId: 'form',
            name: 'Signup form',
            desc: 'Credit card + bio form',
            targets: [
              {
                targetId: 'cc-number',
                name: 'Card number',
                desc: 'Credit card number — 16 digits',
                actionKinds: ['fill'],
                selector: { css: '#cc' },
                sensitive: true
              },
              {
                targetId: 'bio',
                name: 'Bio',
                desc: 'Short bio — rich text',
                actionKinds: ['fill'],
                selector: { css: '#bio' }
              },
              {
                targetId: 'pw',
                name: 'Password',
                desc: 'Account password — sensitive',
                actionKinds: ['fill'],
                selector: { css: '#pw' },
                sensitive: true
              }
            ]
          }
        ]
      }
    </script>
  </body>
</html>
