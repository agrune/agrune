<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>overlay-modal fixture</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 16px; }
      #toolbar { display: flex; gap: 8px; padding: 12px; background: #eee; }
      #toolbar button { padding: 8px 12px; }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 9999; }
      .modal-backdrop.open { display: flex; }
      .modal { background: white; padding: 24px; border-radius: 8px; min-width: 280px; }
      .modal button { padding: 8px 12px; margin-right: 8px; }
    </style>
  </head>
  <body>
    <main>
      <div id="toolbar">
        <button id="save">Save</button>
        <button id="cancel">Cancel</button>
      </div>
    </main>

    <div class="modal-backdrop" id="backdrop" role="presentation">
      <div class="modal" role="dialog" aria-modal="true">
        <p>Discard your changes?</p>
        <button id="discard">Discard</button>
        <button id="keep">Keep editing</button>
      </div>
    </div>

    <script>
      window.__agrune_manifest__ = {
        version: 3,
        groups: [
          {
            groupId: 'toolbar',
            name: 'Toolbar',
            desc: 'Document toolbar',
            targets: [
              {
                targetId: 'save-btn',
                name: 'Save',
                desc: 'Save the document',
                actionKinds: ['click'],
                selector: { text: 'Save' }
              },
              {
                targetId: 'cancel-btn',
                name: 'Cancel',
                desc: 'Cancel pending edits',
                actionKinds: ['click'],
                selector: { css: '#cancel' }
              }
            ]
          },
          {
            groupId: 'confirm-modal',
            name: 'Confirm Modal',
            desc: 'Discard confirmation',
            targets: [
              {
                targetId: 'modal-discard',
                name: 'Discard',
                desc: 'Confirm discard and close modal',
                actionKinds: ['click'],
                selector: { css: '#discard' }
              },
              {
                targetId: 'modal-keep',
                name: 'Keep editing',
                desc: 'Cancel discard and close modal',
                actionKinds: ['click'],
                selector: { css: '#keep' }
              }
            ]
          }
        ]
      }

      const backdrop = document.getElementById('backdrop')
      document.getElementById('cancel').addEventListener('click', () => backdrop.classList.add('open'))
      document.getElementById('keep').addEventListener('click', () => backdrop.classList.remove('open'))
      document.getElementById('discard').addEventListener('click', () => { backdrop.classList.remove('open'); document.body.setAttribute('data-discarded', '1') })
    </script>
  </body>
</html>
