<!--
  agrune legacy-attribute ignore regression fixture (Phase 17)

  Purpose: verify that the Phase 17 runtime *ignores* legacy data-agrune-*
  DOM attributes. The body intentionally preserves a data-agrune-action /
  data-agrune-group block — the runtime is expected to boot to source=idle
  with hasManifest=false and descriptorCount=0 despite those attributes.

  File name is kept so the scripts/regression-guard allow-list does not
  need an update, but the semantics are reversed: this fixture is now a
  live "legacy ignore" harness, not a positive inline-scan fixture.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agrune Legacy-Attribute Ignore Fixture</title>
  <script src="/runtime.bundle.js"></script>
</head>
<body>
  <!-- These attributes are fixture-only bait. The Phase 17 runtime must
       NOT interpret them as mappings. Allow-listed in
       scripts/regression-guard/data-agrune-allowlist.txt once introduced
       in Wave 4. -->
  <div data-agrune-group="main" data-agrune-group-name="Main">
    <button data-agrune-action="click" data-agrune-key="save" data-agrune-name="Save button">Save</button>
  </div>
  <script>
    (function () {
      var runtimeApi = window.__agrune_runtime__;
      if (!runtimeApi || typeof runtimeApi.buildEmptyManifest !== 'function') {
        window.__agrune_runtime_state__ = {
          hasManifest: false,
          source: 'runtime-missing',
          descriptorCount: 0,
        };
        return;
      }
      // Manifest-only resolution — no window manifest, no preload manifest,
      // so this page must land on source=idle. If a future runtime regression
      // re-introduces DOM scanning, descriptorCount would become nonzero and
      // the spec will fail.
      function resolveManifest() {
        if (window.__agrune_manifest__) return { manifest: window.__agrune_manifest__, hasManifest: true, source: 'window' };
        if (window.__agrune_preload_manifest__) return { manifest: window.__agrune_preload_manifest__, hasManifest: true, source: 'preload' };
        return { manifest: runtimeApi.buildEmptyManifest(), hasManifest: false, source: 'idle' };
      }
      function countDescriptors(manifest) {
        if (!manifest || !Array.isArray(manifest.groups)) return 0;
        var total = 0;
        for (var i = 0; i < manifest.groups.length; i++) {
          var g = manifest.groups[i];
          if (g && Array.isArray(g.targets)) total += g.targets.length;
        }
        return total;
      }
      function install() {
        var resolved = resolveManifest();
        runtimeApi.installPageAgentRuntime(resolved.manifest, { cdpPostMessage: function () {} });
        // Parity with idle-boot.html (Phase 17 REVIEW WR-03):
        // writable:false = catches accidental runtime self-overwrite.
        // configurable:true = intentional, lets Playwright re-install on page
        // reload without a TypeError. Fixtures are repo-controlled so an
        // attacker-delete-and-redefine is out of scope.
        Object.defineProperty(window, '__agrune_runtime_state__', {
          value: {
            hasManifest: resolved.hasManifest,
            source: resolved.source,
            descriptorCount: countDescriptors(resolved.manifest),
          },
          writable: false,
          configurable: true,
          enumerable: true,
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', install, { once: true });
      } else {
        install();
      }
    })();
  </script>
</body>
</html>
